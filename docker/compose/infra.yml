# ==============================================================================
# Hạ tầng dùng chung (Kafka, MinIO, Redis) và lưu trữ chuyên biệt (HBase)
# ==============================================================================
services:
  kafka:
    profiles: ["batch", "stream", "legacy", "all"]
    image: apache/kafka:latest
    container_name: kafka_container
    hostname: kafka
    restart: unless-stopped
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${KAFKA_EXTERNAL_PORT:-9092}:9092"
    expose:
      - "9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9094,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9094,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:${KAFKA_EXTERNAL_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9094 >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 15s
      retries: 12
      start_period: 20s
    networks:
      - music-net

  minio:
    profiles: ["batch", "gold", "all"]
    image: taihb2005/minio:1.0.0
    container_name: datalake
    hostname: minio
    restart: unless-stopped
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${MINIO_API_PORT:-9000}:9000"
      - "${HOST_BIND_IP:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ${MINIO_HOST_VOLUME:-minio_data}:/data
    command: server /data --console-address ":9001"
    networks:
      - music-net

  redis:
    profiles: ["batch", "stream", "legacy", "all"]
    image: redis:8.2-alpine
    container_name: redis
    restart: always
    mem_limit: 700m
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Đặt REDIS_PASSWORD trong file .env}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - noeviction
      - --save
      - "300 10"
      - --dir
      - /data
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - music-net

  hbase:
    profiles: ["stream", "legacy", "all"]
    image: harisekhon/hbase:2.1
    container_name: hbase
    hostname: hbase
    restart: unless-stopped
    mem_limit: 2g
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:16010:16010"
      - "${HOST_BIND_IP:-127.0.0.1}:9090:9090"
      - "${HOST_BIND_IP:-127.0.0.1}:8080:8080"
    volumes:
      - hbase_data_v2:/hbase-data
      - hbase_zk:/tmp/hbase-root
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9090' && echo list | hbase shell -n 2>&1 | grep -q 'row(s)'"]
      interval: 20s
      timeout: 60s
      retries: 15
      start_period: 60s
    networks:
      - music-net
