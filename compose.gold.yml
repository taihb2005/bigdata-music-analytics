# Standalone serving stack for an existing Silver lake on MinIO.
name: music-gold
services:
  gold-worker:
    build:
      context: .
      dockerfile: docker/gold/Dockerfile
      target: worker
    env_file: [.env]
    restart: unless-stopped
    volumes:
      - ./data/delta:/app/data/delta:ro
  api:
    build:
      context: .
      dockerfile: docker/python-stream/Dockerfile
      target: gold-api
    env_file: [.env]
    command: ["python", "-m", "stream.api.server", "--redis-url", "redis://host.docker.internal:6379/0",
              "--hbase-host", "host.docker.internal"]
    ports: ["127.0.0.1:8001:8000"]
    restart: unless-stopped
  dashboard:
    build:
      context: .
      dockerfile: docker/gold/Dockerfile
      target: dashboard
    environment:
      MUSIC_API_URL: http://api:8000
      DASHBOARD_DEFAULT_VIEW: gold
    ports: ["127.0.0.1:8501:8501"]
    depends_on: [api]
    restart: unless-stopped
