services:
  kafka:
    image: apache/kafka:latest
    container_name: kafka_container
    hostname: kafka
    ports:
      - "9092:9092"
    expose:
      - "9094"  
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9094,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9094,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - data-net
      - inter-net

  minio:
    profiles: ["batch"]
    image: taihb2005/minio:1.0.0
    container_name: datalake
    hostname: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - data-net
      
  redis:
    image: redis:8.2-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    networks:
      - data-net
      - inter-net

  hbase:
    image: harisekhon/hbase:2.1
    container_name: hbase
    hostname: hbase
    restart: unless-stopped
    ports:
      - "16010:16010"
      - "9090:9090"
      - "8080:8080"
    volumes:
      - hbase_data:/hbase-data
    networks:
      - data-net

  stream-init:
    build:
      context: .
      dockerfile: docker/python-stream/Dockerfile
    container_name: stream_init
    command:
      - python
      - stream/bootstrap/init_stream_resources.py
      - --bootstrap-servers
      - kafka:9094
      - --hbase-host
      - hbase
    volumes:
      - ./redis/redis.conf:/app/redis/redis.conf:ro
    depends_on:
      - kafka
      - hbase
    networks:
      - data-net
    restart: "no"

  scrobble-producer:
    build:
      context: .
      dockerfile: docker/python-stream/Dockerfile
    container_name: scrobble_producer
    command:
      - python
      - stream/producer/produce_scrobbles.py
      - --bootstrap-servers
      - kafka:9094
      - --poll-seconds
      - "60"
      - --limit
      - "50"
    env_file:
      - .env
    volumes:
      - ./dataset/state:/app/dataset/state
    depends_on:
      kafka:
        condition: service_started
      stream-init:
        condition: service_completed_successfully
    networks:
      - data-net
    restart: unless-stopped

  spark-speed-layer:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    container_name: spark_speed_layer
    environment:
      PYTHONPATH: /opt/app
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - local[*]
      - --conf
      - spark.jars.ivy=/tmp/.ivy2
      - --conf
      - spark.executorEnv.PYTHONPATH=/opt/app
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.13:4.2.0
      - /opt/app/stream/processing/spark_speed_layer.py
      - --bootstrap-servers
      - kafka:9094
      - --starting-offsets
      - earliest
      - --hbase-host
      - hbase
      - --redis-url
      - redis://redis:6379/0
      - --checkpoint
      - /opt/app/dataset/state/spark-speed-layer-v2
    volumes:
      - ./:/opt/app
    depends_on:
      stream-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    networks:
      - data-net
    restart: unless-stopped

  metadata-worker:
    build:
      context: .
      dockerfile: docker/python-stream/Dockerfile
    container_name: metadata_worker
    command:
      - python
      - stream/metadata/metadata_worker.py
      - --bootstrap-servers
      - kafka:9094
    env_file:
      - .env
    depends_on:
      stream-init:
        condition: service_completed_successfully
    networks:
      - data-net
    restart: unless-stopped

  metadata-sink:
    build:
      context: .
      dockerfile: docker/python-stream/Dockerfile
    container_name: metadata_sink
    command:
      - python
      - stream/metadata/metadata_sink.py
      - --bootstrap-servers
      - kafka:9094
      - --hbase-host
      - hbase
      - --redis-url
      - redis://redis:6379/0
    volumes:
      - ./redis/redis.conf:/app/redis/redis.conf:ro
    depends_on:
      stream-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    networks:
      - data-net
    restart: unless-stopped

volumes:
  kafka_data:
  redis_data:
  minio_data:
  hbase_data:
 
networks:
  data-net:
    driver: bridge
  inter-net:
    driver: bridge
    internal: true
