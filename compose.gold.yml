# Standalone serving stack for an existing Silver lake on MinIO.
name: music-gold
services:
  gold-worker:
    build:
      context: .
      dockerfile: docker/gold/Dockerfile
      target: worker
    env_file: [.env]
    restart: unless-stopped
    volumes:
      - ./data/delta:/app/data/delta:ro
  api:
    build:
      context: .
      dockerfile: docker/gold/Dockerfile
      target: api
    env_file: [.env]
    ports: ["127.0.0.1:8001:8000"]
    restart: unless-stopped
  dashboard:
    build:
      context: .
      dockerfile: docker/gold/Dockerfile
      target: dashboard
    environment:
      MUSIC_API_URL: http://api:8000
    ports: ["127.0.0.1:8501:8501"]
    depends_on: [api]
    restart: unless-stopped
