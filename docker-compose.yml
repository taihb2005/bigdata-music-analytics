# ==============================================================================
# Docker Compose Root Entrypoint - Big Data Music Analytics (Lambda Architecture)
#
# Các chế độ khởi động (từ thư mục gốc dự án):
#   - Chỉ tầng Gold:   docker compose --profile gold up -d --build
#   - Luồng Batch:     docker compose --profile batch up -d --build
#   - Luồng Stream:    docker compose --profile stream up -d --build
#   - Toàn hệ thống:   docker compose --profile all up -d --build
#   - Phát lại demo:   docker compose --profile replay run --rm replay
#   - Công cụ CLI:     docker compose --profile tools run --rm app ...
# ==============================================================================
name: bigdata-music-analytics

include:
  - path:
      - docker/compose/infra.yml
      - docker/compose/batch.yml
      - docker/compose/stream.yml
      - docker/compose/serving.yml
    project_directory: .
    env_file: .env

networks:
  music-net:
    name: music-net
    driver: bridge

volumes:
  kafka_data:
    external: true
    name: batch_kafka_data
  minio_data:
    external: true
    name: batch_minio_data
  redis_data:
  hbase_data_v2:
  hbase_zk:
